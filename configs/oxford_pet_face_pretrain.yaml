# FACE-PRETRAIN-001：使用Oxford-IIIT Pet头部ROI预训练猫狗脸检测器。
experiment:
  id: FACE-PRETRAIN-001
  name: oxford_pet_face_pretrain

seed: 42
device: auto

data:
  dataset_root: ../cat&dog/06_public_datasets/oxford_iiit_pet/labelme
  class_names: [cat_face, dog_face]
  num_workers: 4

model:
  backbone: resnet50_fpn
  pretrained: true
  trainable_backbone_layers: 3
  min_size: 800
  max_size: 1333

training:
  epochs: 20
  batch_size: 4
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  step_size: 8
  gamma: 0.1
  gradient_clip_norm: 10.0
  amp: true
  horizontal_flip_probability: 0.5
  output_dir: outputs/oxford_pet_face_pretrain

evaluation:
  score_threshold: 0.5
  iou_threshold: 0.5
  nms_threshold: 0.5
  max_error_images: 100
