# FACE-PRETRAIN-KAGGLE-001：Kaggle T4 x2猫狗脸检测预训练。
experiment:
  id: FACE-PRETRAIN-KAGGLE-001
  name: kaggle_oxford_pet_face_pretrain

seed: 42
device: auto

data:
  # Notebook启动训练前设置 OXFORD_FACE_DATASET_ROOT；兼容Kaggle不同挂载层级。
  dataset_root: ${OXFORD_FACE_DATASET_ROOT}
  class_names: [cat_face, dog_face]
  # DDP下为每个进程的worker数；Kaggle通常只有4个CPU核心。
  num_workers: 2

model:
  backbone: resnet50_fpn
  pretrained: true
  trainable_backbone_layers: 3
  min_size: 800
  max_size: 1333

training:
  epochs: 20
  # 每张GPU的batch size；T4 x2时全局batch size为4。
  batch_size: 2
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  step_size: 8
  gamma: 0.1
  gradient_clip_norm: 10.0
  amp: true
  horizontal_flip_probability: 0.5
  output_dir: /kaggle/working/outputs/oxford_pet_face_pretrain

evaluation:
  score_threshold: 0.5
  iou_threshold: 0.5
  nms_threshold: 0.5
  max_error_images: 100
